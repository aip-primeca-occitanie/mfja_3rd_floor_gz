# Default dry-run batch for Room 315 PDDL-based VLA scenario generation.
#
# The first milestone keeps this to simple shuttle station-to-station routes.
# Optional goals are listed for ad-hoc runs without changing the default batch.

batch_id: room315_pddl_station_shuttles

goals:
  - right_yaskawa_to_staubli
  - right_staubli_to_yaskawa
  - left_yaskawa_to_kuka
  - left_kuka_to_yaskawa

optional_later_goals:
  - right_loaded_r2_to_staubli
  - right_loaded_to_slot3
  - right_loaded_to_slot3_clear_blocker
  - right_empty_r1_to_yaskawa
  - left_loaded_l2_to_kuka
  - right_full_exterior_loop
  - left_full_exterior_loop
  - emergency_stop_all

repetitions_per_goal: 3
language_seed: 42
speed_values: [0.2, 0.3, 0.5]
output_dataset_dir: room315_pddl_vla_dataset
dry_run: true
execute: false
shuffle: false
