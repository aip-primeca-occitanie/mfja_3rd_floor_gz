room_315_task_execution_node:
  ros__parameters:
    use_sim_time: true

    # Fail closed by default. The guarded launch command must opt in.
    execution_enabled: false

    task_goal_topic: /room_315/task_goal
    task_status_topic: /room_315/task_goal/status
    accepted_observed_state_topic: /room_315/visual_state/observed_state
    # Planner provenance allowlist. Change the schema and checkpoint together,
    # and only after the matching visual runtime candidate passes acceptance.
    # Keeping both V3 values here preserves the current rollback target.
    allowed_visual_schema_version: room315.visual_state.v3
    allowed_visual_checkpoint_sha256: 8a2d865e3d3551ec4284b53aa913d66f24640e23556f2f26b49a165f3ce8d51d
    supervisor_command_topic: /room_315/vla/command
    supervisor_status_topic: /room_315/vla/status
    # Direct 30 Hz deterministic binary feedback anchors exact slot occupancy
    # and gates final arrival. Its segment/s/s_ratio fields are ignored.
    left_sensor_feedback_topic: /room_315/rails/left/sensors/feedback
    right_sensor_feedback_topic: /room_315/rails/right/sensors/feedback
    diagnostics_topic: /diagnostics

    planner_service: /planner/get_plan
    # POPF has a 15-second solver timeout; the client must not abandon the
    # service first and turn a valid slow response into a false rejection.
    planner_timeout_s: 20.0

    observation_timeout_s: 1.5
    supervisor_status_timeout_s: 1.5
    # Fresh binary DZI sensor occupancy may anchor an exact slot using only
    # sensor name, active state, and shuttle identity. Position fields remain
    # excluded and learned block/s_m/s_ratio predictions remain unchanged.
    slot_sensor_state_timeout_s: 1.0
    observation_wait_s: 2.0
    # Broad enough to derive initial planner occupancy from learned position.
    planning_slot_tolerance_ratio: 0.12
    # Target stopping uses a separate, strict dimensionless window around the
    # authoritative slot ratio. It must not depend on predicted segment length.
    target_arrival_tolerance_ratio: 0.05
    # Must match the accepted visual-state validator.
    position_consistency_tolerance_m: 0.08
    slot_sensor_confirmation_frames: 2
    # Deprecated: retained only so older launch overrides do not fail.
    arrival_confirmation_frames: 3
    # Payload-qualified requests are grounded only after consecutive fresh
    # visual frames agree on the same identity. No controller payload field is
    # used, and lack of consensus rejects the request before actuation.
    payload_grounding_confirmation_frames: 5
    payload_grounding_max_observations: 15
    controller_stop_timeout_s: 3.0

    speed_mps: 0.2
    max_steps: 32
    max_replans: 8
    max_unknown_retries: 3
    supervisor_timeout_s: 5.0
    effect_timeout_s: 30.0
    # Interior blocker relocation may traverse more than one ordinary block.
    clearance_effect_timeout_s: 60.0
    # Exact slot arrival is still accepted only from the identity-bearing DZI
    # sensor and controller stop. The deadline expands deterministically for a
    # long forward-only topology route (for example A34I -> right slot 4).
    route_arrival_timeout_scale: 1.25
    route_arrival_timeout_margin_s: 5.0

    # This must match the Gazebo launch setting
    # enable_room315_vla_obstacles:=false. Shuttle blockers are still derived
    # from learned visual segment/position outputs.
    external_obstacles_disabled: true
    diagnostic_period_s: 1.0
