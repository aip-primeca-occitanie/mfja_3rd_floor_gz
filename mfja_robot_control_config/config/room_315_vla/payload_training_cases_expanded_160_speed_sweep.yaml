schema_version: 1
description: Active Room 315 payload training cases. The current training
  matrix contains 160 validated speed-sweep cases with distinct commanded
  shuttle speeds to broaden timing, image-frame, and action-vector coverage.
review_gate:
  training_export_default: validated_batch_dataset
  bad_cases_action: report_case_number_and_fix_case_definition
  curation_method: automatic_accept_successful_batch_runs
  model_input_boundary:
  - model_input.language
  - model_input.overhead_images
  - model_input.last_command
  - model_input.observable_state
augmentation:
  source_case_config: retired_payload_training_cases_40_golden
  source_case_count: 40
  strategy: speed_sweep_from_validated_case_families
  speeds_mps:
  - 0.06
  - 0.08
  - 0.1
  - 0.12
  notes:
  - Case IDs are suffixed by speed and are the active in-repository case IDs.
  - Run through the normal batch runner and export only approved_for_training episodes.
cases:
- case_id: right_loaded_r1_s1_to_slot3_no_blocker_speed006
  title: Loaded R1 from slot 1 to slot 3, no blocker (speed 0.06 m/s)
  side: right
  target_slot: '3'
  payload_condition: loaded
  selection_policy: nearest_loaded_to_target_slot_then_lowest_id
  loaded_shuttles:
  - right_shuttle_1
  start_slots_by_shuttle:
    right_shuttle_1: '1'
  launch:
    right_shuttle_count: 1
    right_start_slots: '1'
    right_loaded_shuttles: R1
  expected:
    selected_shuttle: right_shuttle_1
    selected_target_slot: '3'
    blocker_clear_slot: ''
  speed: 0.06
  base_case_id: right_loaded_r1_s1_to_slot3_no_blocker
  base_case_number: 1
  augmentation:
    type: speed_sweep
    speed_mps: 0.06
