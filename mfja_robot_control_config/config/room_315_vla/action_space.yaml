schema_version: 3
action_schema_version: 3
model_input_schema_version: 3
description: >
  Event-level symbolic action representation used to adapt open-source VLA
  policies such as SmolVLA to the Room 315 rail-cell task. The policy predicts
  the next direct decision event, not a legacy high-level route command, not repeated
  framewise commands, and not raw Gazebo controls.

action_vector_fields:
  - primitive_id
  - side_id
  - shuttle_index
  - switch_mask_A1
  - switch_mask_A2
  - switch_mask_A3
  - switch_mask_A4
  - switch_value_A1
  - switch_value_A2
  - switch_value_A3
  - switch_value_A4
  - stopper_mask_A1
  - stopper_mask_A2
  - stopper_mask_A3
  - stopper_mask_A4
  - stopper_value_A1
  - stopper_value_A2
  - stopper_value_A3
  - stopper_value_A4
  - speed_mps
  - wait_condition_id
  - target_id
  - reason_id
  - coordination_mode

symbolic_action_fields:
  - primitive
  - side
  - shuttle_id
  - shuttle_index
  - switch_mask
  - switch_values
  - stopper_mask
  - stopper_values
  - speed_mps
  - wait_condition
  - target_id
  - reason
  - coordination_mode

primitive_ids:
  WAIT: 0
  DONE: 1
  SET_SWITCHES: 2
  SET_STOPPERS: 3
  SHUTTLE_ON: 4
  STOP_NOW: 5
  EMERGENCY_STOP: 6

side_ids:
  right: 0
  left: 1

switch_value_ids:
  UNCHANGED: 0
  EXTERIOR: 1
  INTERIOR: 2

stopper_value_ids:
  UNCHANGED: 0
  open: 1
  closed: 2

device_mask_ids:
  unchanged: 0
  selected: 1

wait_condition_ids:
  none: 0
  switch_state_match: 1
  stopper_state_match: 2
  shuttle_command_applied: 3
  task_terminal_status: 4
  reserved_legacy_wait_5: 5
  terminal: 6
  target_sensor_active: 7
  block_clearance: 8
  headway_clearance: 9

target_ids:
  none: 0
  A1: 1
  A2: 2
  A3: 3
  A4: 4
  ALL_SWITCHES: 5
  ALL_STOPPERS: 6
  MULTIPLE_DEVICES: 7
  right_shuttle: 8
  left_shuttle: 9
  reserved_legacy_target_10: 10
  reserved_legacy_target_11: 11
  reserved_legacy_target_12: 12
  reserved_legacy_target_13: 13
  reserved_legacy_target_14: 14
  reserved_legacy_target_15: 15
  reserved_legacy_target_16: 16
  terminal: 17
  DZI1R: 18
  DZI2R: 19
  DZI3R: 20
  DZI4R: 21
  DZI1L: 22
  DZI2L: 23
  DZI3L: 24
  DZI4L: 25
  DA3IR: 26
  DA3IL: 27
  right_shuttle_1: 28
  right_shuttle_2: 29
  right_shuttle_3: 30
  right_shuttle_4: 31
  left_shuttle_1: 32
  left_shuttle_2: 33
  left_shuttle_3: 34
  left_shuttle_4: 35

reason_ids:
  none: 0
  command_event: 1
  reserved_legacy_reason_2: 2
  reserved_legacy_reason_3: 3
  task_succeeded: 4
  task_failed: 5
  episode_stopped: 6
  episode_discarded: 7
  switch_update: 8
  stopper_update: 9
  shuttle_start: 10
  shuttle_stop: 11
  emergency: 12
  unsupported_command: 13
  target_station_route: 14
  wait_for_block_clearance: 15
  maintain_headway: 16
  avoid_collision: 17
  avoid_deadlock: 18
  obstacle_stop: 19
  wrong_shuttle_rejected: 20
  fleet_coordination: 21

coordination_mode_ids:
  normal: 0
  guarded_motion: 1
  wait_for_clearance: 2
  reservation_based_move: 3
  fleet_coordination: 4
  emergency: 5

shuttle_identity:
  max_shuttles_per_side: 4
  stable_ids:
    right: [right_shuttle_1, right_shuttle_2, right_shuttle_3, right_shuttle_4]
    left: [left_shuttle_1, left_shuttle_2, left_shuttle_3, left_shuttle_4]
  short_ids:
    right: [R1, R2, R3, R4]
    left: [L1, L2, L3, L4]
  shuttle_index_encoding:
    first_shuttle_on_side: 0
    second_shuttle_on_side: 1
    third_shuttle_on_side: 2
    fourth_shuttle_on_side: 3
    global_or_unassigned: -1

