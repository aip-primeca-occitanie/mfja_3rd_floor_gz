  - right_sensor_DA3ER
  - right_sensor_DA3IR
  - right_sensor_DA4R
  - right_sensor_DA4ER
  - right_sensor_DA4IR
  - right_sensor_A1_STOPPER_SENSOR
  - right_sensor_A2_STOPPER_SENSOR
  - right_sensor_A3_STOPPER_SENSOR
  - right_sensor_A4_STOPPER_SENSOR
  - left_sensor_DZI1L
  - left_sensor_DZI2L
  - left_sensor_DZI3L
  - left_sensor_DZI4L
  - left_sensor_DA1L
  - left_sensor_DA1EL
