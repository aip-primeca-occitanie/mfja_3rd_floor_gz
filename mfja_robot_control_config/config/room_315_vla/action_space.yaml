schema_version: 1
description: >
  Discrete action representation used to adapt open-source VLA policies such as
  SmolVLA to the Room 315 rail-cell task. The policy predicts this compact
  vector; a post-processor converts it to the JSON commands accepted by the
  Room 315 VLA supervisor.

action_vector_fields:
  - action_id
  - side_id
  - slot_id
  - loop_id
  - shuttle_command_id
  - switch_all_state_id
  - stopper_all_state_id
  - start
  - close_stoppers
  - speed_mps

action_ids:
  status: 0
  route_shuttle: 2
  switches: 3
  stoppers: 4
  shuttle: 5
  add_shuttle: 6
  stop_all: 7
  emergency_stop: 8
  clear_emergency_stop: 9


side_ids:
  none: 0
  right: 1
  left: 2

loop_ids:
  none: 0
  exterior: 1
  interior: 2

shuttle_command_ids:
  none: 0
  "OFF": 1
  "ON": 2
  ADD_STOPPED: 3
  ADD_MOVING: 4

switch_all_state_ids:
  none: 0
  EXTERIOR: 1
  INTERIOR: 2

stopper_all_state_ids:
  none: 0
  open: 1
  closed: 2

observation_state_fields:
  - emergency_stop
  - vision_image_frames
  - right_shuttle_count
  - right_active_sensors
  - right_active_position_sensors
  - left_shuttle_count
  - left_active_sensors
  - left_active_position_sensors
  - right_switch_A1
  - right_switch_A2
  - right_switch_A3
  - right_switch_A4
  - left_switch_A1
  - left_switch_A2
  - left_switch_A3
  - left_switch_A4
  - right_stopper_A1
  - right_stopper_A2
  - right_stopper_A3
  - right_stopper_A4
  - left_stopper_A1
  - left_stopper_A2
  - left_stopper_A3
  - left_stopper_A4

state_encodings:
  switch:
    unknown: 0
    EXTERIOR: 1
    INTERIOR: 2
  stopper:
    unknown: 0
    open: 1
    closed: 2
