schema_version: 2
model_input_schema_version: 3
description: >
  Event-level symbolic action representation used to adapt open-source VLA
  policies such as SmolVLA to the Room 315 rail-cell task. The policy predicts
  the next direct decision event, not a high-level route_template, not repeated
  framewise commands, and not raw Gazebo controls.

action_vector_fields:
  - primitive_id
  - side_id
  - switch_mask_A1
  - switch_mask_A2
  - switch_mask_A3
  - switch_mask_A4
  - switch_value_A1
  - switch_value_A2
  - switch_value_A3
  - switch_value_A4
  - stopper_mask_A1
  - stopper_mask_A2
  - stopper_mask_A3
  - stopper_mask_A4
  - stopper_value_A1
  - stopper_value_A2
  - stopper_value_A3
  - stopper_value_A4
  - speed_mps
  - wait_condition_id
  - target_id
  - reason_id

symbolic_action_fields:
  - primitive
  - side
  - switch_mask
  - switch_values
  - stopper_mask
  - stopper_values
  - speed_mps
  - wait_condition
  - target_id
  - reason

primitive_ids:
  WAIT: 0
  DONE: 1
  SET_SWITCHES: 2
  SET_STOPPERS: 3
  SHUTTLE_ON: 4
  STOP_NOW: 5
  EMERGENCY_STOP: 6

side_ids:
  right: 0
  left: 1

switch_value_ids:
  UNCHANGED: 0
  EXTERIOR: 1
  INTERIOR: 2

stopper_value_ids:
  UNCHANGED: 0
  open: 1
  closed: 2

device_mask_ids:
  unchanged: 0
  selected: 1

wait_condition_ids:
  none: 0
  switch_state_match: 1
  stopper_state_match: 2
  shuttle_command_applied: 3
  task_terminal_status: 4
  task_phase_observed: 5
  terminal: 6
  target_sensor_active: 7

target_ids:
  none: 0
  A1: 1
  A2: 2
  A3: 3
  A4: 4
  ALL_SWITCHES: 5
  ALL_STOPPERS: 6
  MULTIPLE_DEVICES: 7
  right_shuttle: 8
  left_shuttle: 9
  right_yaskawa_to_staubli: 10
  right_staubli_to_yaskawa: 11
  left_yaskawa_to_kuka: 12
  left_kuka_to_yaskawa: 13
  right_enter_interior_loop: 14
  left_enter_interior_loop: 15
  task_phase: 16
  terminal: 17
  DZI1R: 18
  DZI2R: 19
  DZI3R: 20
  DZI4R: 21
  DZI1L: 22
  DZI2L: 23
  DZI3L: 24
  DZI4L: 25
  DA3IR: 26
  DA3IL: 27

reason_ids:
  none: 0
  command_event: 1
  route_template_requested: 2
  task_phase: 3
  task_succeeded: 4
  task_failed: 5
  episode_stopped: 6
  episode_discarded: 7
  switch_update: 8
  stopper_update: 9
  shuttle_start: 10
  shuttle_stop: 11
  emergency: 12
  unsupported_command: 13

observation_state_fields:
  - emergency_stop
  - vision_image_frames
  - right_sensor_DZI1R
  - right_sensor_DZI2R
  - right_sensor_DZI3R
  - right_sensor_DZI4R
  - right_sensor_DA1R
  - right_sensor_DA1ER
