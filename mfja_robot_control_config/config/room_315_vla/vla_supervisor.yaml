schema_version: 3
description: >
  High-level task templates for expert demos, manual checks, and benchmarks in
  Room 315. The learned VLA policy is expected to output event-level direct
  symbolic commands, preferably schema-v3 action_vector values, not these
  templates as its final action interface. The supervisor still accepts
  route_template commands so demos and benchmarks can expand them into
  deterministic primitive rail commands while keeping emergency-stop gating in
  one place.

defaults:
  speed: 0.2
  completed_task_limit: 20
  shuttle_name_by_side:
    right: room315_right_shuttle_1
    left: room315_left_shuttle_1
  slot_sensor_by_side:
    right:
      "1": DZI1R
      "2": DZI2R
      "3": DZI3R
      "4": DZI4R
    left:
      "1": DZI1L
      "2": DZI2L
      "3": DZI3L
      "4": DZI4L

route_templates:
  right_yaskawa_to_staubli:
    type: transport
    description: Move an available right-rail shuttle from Yaskawa HC10DT slots 1/2 to Staubli TX2 slots 3/4.
    side: right
    source_slots: ["1", "2"]
    target_slots: ["3", "4"]
    prepare_switches:
      ALL: EXTERIOR
    prepare_stoppers:
      ALL: "0"
    timeout_s: 120.0
    aliases:
      - move the right shuttle from yaskawa to staubli
      - move right shuttle from yaskawa to staubli
      - right yaskawa to staubli
      - right yaskawa hc10dt to staubli tx2

  right_staubli_to_yaskawa:
    type: transport
    description: Move an available right-rail shuttle from Staubli TX2 slots 3/4 to Yaskawa HC10DT slots 1/2.
    side: right
    source_slots: ["3", "4"]
    target_slots: ["1", "2"]
    prepare_switches:
      ALL: EXTERIOR
    prepare_stoppers:
      ALL: "0"
    timeout_s: 120.0
    aliases:
      - move the right shuttle from staubli to yaskawa
      - move right shuttle from staubli to yaskawa
      - right staubli to yaskawa
      - right staubli tx2 to yaskawa hc10dt

  left_yaskawa_to_kuka:
    type: transport
    description: Move an available left-rail shuttle from Yaskawa HC10 slots 1/2 to KUKA KR6 slots 3/4.
    side: left
    source_slots: ["1", "2"]
    target_slots: ["3", "4"]
    prepare_switches:
      ALL: EXTERIOR
    prepare_stoppers:
      ALL: "0"
    timeout_s: 120.0
    aliases:
      - move the left shuttle from yaskawa to kuka
      - move left shuttle from yaskawa to kuka
      - left yaskawa to kuka
      - left yaskawa hc10 to kuka kr6

  left_kuka_to_yaskawa:
    type: transport
    description: Move an available left-rail shuttle from KUKA KR6 slots 3/4 to Yaskawa HC10 slots 1/2.
    side: left
    source_slots: ["3", "4"]
    target_slots: ["1", "2"]
    prepare_switches:
      ALL: EXTERIOR
    prepare_stoppers:
      ALL: "0"
    timeout_s: 120.0
    aliases:
      - move the left shuttle from kuka to yaskawa
      - move left shuttle from kuka to yaskawa
      - left kuka to yaskawa
      - left kuka kr6 to yaskawa hc10

  right_enter_interior_loop:
    type: loop_entry
    description: Stop a right-rail shuttle from source slots 1/2 before A3, switch all turnouts to INTERIOR, then release it into the interior loop.
    side: right
    source_slots: ["1", "2"]
    gate_stopper: A3
    approach_switch_state: EXTERIOR
    target_switch_state: INTERIOR
    completion_sensors: [DA3IR]
    completion_segments: [A34I]
    timeout_s: 120.0
    aliases:
      - make the right shuttle circulate on the interior loop
      - right shuttle enter interior loop
      - enter interior mode right
      - right enter interior loop

  left_enter_interior_loop:
    type: loop_entry
    description: Stop a left-rail shuttle from source slots 1/2 before A3, switch all turnouts to INTERIOR, then release it into the interior loop.
    side: left
    source_slots: ["1", "2"]
    gate_stopper: A3
    approach_switch_state: EXTERIOR
    target_switch_state: INTERIOR
    completion_sensors: [DA3IL]
    completion_segments: [A34I]
    timeout_s: 120.0
    aliases:
      - make the left shuttle circulate on the interior loop
      - left shuttle enter interior loop
      - enter interior mode left
      - left enter interior loop

template_aliases:
  move the right shuttle from yaskawa to staubli: right_yaskawa_to_staubli
  move right shuttle from yaskawa to staubli: right_yaskawa_to_staubli
  right yaskawa to staubli: right_yaskawa_to_staubli
  move the right shuttle from staubli to yaskawa: right_staubli_to_yaskawa
  move right shuttle from staubli to yaskawa: right_staubli_to_yaskawa
  right staubli to yaskawa: right_staubli_to_yaskawa
  move the left shuttle from yaskawa to kuka: left_yaskawa_to_kuka
  move left shuttle from yaskawa to kuka: left_yaskawa_to_kuka
  left yaskawa to kuka: left_yaskawa_to_kuka
  move the left shuttle from kuka to yaskawa: left_kuka_to_yaskawa
  move left shuttle from kuka to yaskawa: left_kuka_to_yaskawa
  left kuka to yaskawa: left_kuka_to_yaskawa
  make the right shuttle circulate on the interior loop: right_enter_interior_loop
  enter interior mode right: right_enter_interior_loop
  right enter interior loop: right_enter_interior_loop
  make the left shuttle circulate on the interior loop: left_enter_interior_loop
  enter interior mode left: left_enter_interior_loop
  left enter interior loop: left_enter_interior_loop
