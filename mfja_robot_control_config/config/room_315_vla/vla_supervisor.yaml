schema_version: 4
description: >
  Room 315 VLA supervisor runtime defaults for the curated 40 payload training
  cases. Legacy high-level station goals are intentionally not configured;
  payload cases execute through generated primitive commands and schema-v3
  action vectors only.

defaults:
  speed: 0.2
  completed_task_limit: 20
  shuttle_name_by_side:
    right: room315_right_shuttle_1
    left: room315_left_shuttle_1
  slot_sensor_by_side:
    right:
      "1": DZI1R
      "2": DZI2R
      "3": DZI3R
      "4": DZI4R
    left:
      "1": DZI1L
      "2": DZI2L
      "3": DZI3L
      "4": DZI4L
