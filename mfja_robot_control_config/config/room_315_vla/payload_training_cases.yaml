    title: Right-rail scene; R2 blocker enters the interior loop so loaded R1 reaches slot 3
    side: right
    speed: 0.08
    target_slot: "3"
    payload_condition: loaded
    selection_policy: nearest_loaded_to_target_slot_then_lowest_id
    loaded_shuttles: [right_shuttle_1]
    start_slots_by_shuttle:
      right_shuttle_1: "1"
      right_shuttle_2: "2"
    blocker_shuttle: right_shuttle_2
    blocker_start_slot: "2"
    blocker_clear_slot: ""
    blocker_clear_target: interior_loop
    blocker_clear_sensor: DA3IR
    blocker_clear_stopper: A3
    blocker_restore_slot: ""
    blocker_restore_policy: none
    clearance_strategy: clear_blocker_to_interior_loop_then_move_loaded
    launch:
      right_shuttle_count: 2
      right_start_slots: "1,2"
      right_loaded_shuttles: "R1"
    expected:
      selected_shuttle: right_shuttle_1
      selected_target_slot: "3"
      blocker_shuttle: right_shuttle_2
      blocker_clear_target: interior_loop
      blocker_clear_sensor: DA3IR

  - case_id: right_loaded_r2_s1_blocker_r3_s2_four_shuttles_interior_to_slot3
