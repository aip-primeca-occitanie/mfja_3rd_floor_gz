schema_version: 1
description: >
  Reviewable Room 315 payload training cases. Each case is intended to be
  launched, visually inspected in Gazebo, validated, and only then exported into
  training_events.jsonl.

review_gate:
  training_export_default: validated_batch_dataset
  bad_cases_action: report_case_number_and_fix_case_definition
  curation_method: automatic_accept_successful_batch_runs
  model_input_boundary:
    - model_input.language
    - model_input.overhead_images
    - model_input.last_command

cases:
  - case_id: right_loaded_r1_s1_to_slot3_no_blocker
    title: Loaded R1 from slot 1 to slot 3, no blocker
    side: right
    target_slot: "3"
    payload_condition: loaded
    selection_policy: nearest_loaded_to_target_slot_then_lowest_id
    loaded_shuttles: [right_shuttle_1]
    start_slots_by_shuttle:
      right_shuttle_1: "1"
    launch:
      right_shuttle_count: 1
      right_start_slots: "1"
      right_loaded_shuttles: "R1"
    expected:
      selected_shuttle: right_shuttle_1
      selected_target_slot: "3"
      blocker_clear_slot: ""

  - case_id: right_loaded_r1_s2_to_slot3_no_blocker
    title: Loaded R1 from slot 2 to slot 3, no blocker
    side: right
    speed: 0.08
    target_slot: "3"
    payload_condition: loaded
    selection_policy: nearest_loaded_to_target_slot_then_lowest_id
    loaded_shuttles: [right_shuttle_1]
    start_slots_by_shuttle:
      right_shuttle_1: "2"
    launch:
      right_shuttle_count: 1
      right_start_slots: "2"
      right_loaded_shuttles: "R1"
    expected:
      selected_shuttle: right_shuttle_1
      selected_target_slot: "3"
      blocker_clear_slot: ""

  - case_id: right_loaded_r2_s2_to_slot3_no_blocker
    title: Loaded R2 from slot 2 to slot 3, no blocker
    side: right
    speed: 0.08
    target_slot: "3"
    payload_condition: loaded
    selection_policy: nearest_loaded_to_target_slot_then_lowest_id
    loaded_shuttles: [right_shuttle_2]
    start_slots_by_shuttle:
      right_shuttle_1: "1"
      right_shuttle_2: "2"
    launch:
      right_shuttle_count: 2
      right_start_slots: "1,2"
      right_loaded_shuttles: "R2"
    expected:
      selected_shuttle: right_shuttle_2
      selected_target_slot: "3"
      blocker_clear_slot: ""

  - case_id: right_loaded_r1_s1_r2_s2_select_r2_to_slot3
    title: R1 and R2 loaded; nearest loaded R2 goes to slot 3
    side: right
    speed: 0.08
    target_slot: "3"
    payload_condition: loaded
    selection_policy: nearest_loaded_to_target_slot_then_lowest_id
    loaded_shuttles: [right_shuttle_1, right_shuttle_2]
    start_slots_by_shuttle:
      right_shuttle_1: "1"
      right_shuttle_2: "2"
    launch:
      right_shuttle_count: 2
      right_start_slots: "1,2"
      right_loaded_shuttles: "R1,R2"
    expected:
      selected_shuttle: right_shuttle_2
      selected_target_slot: "3"
      blocker_clear_slot: ""

  - case_id: right_loaded_r1_s2_blocker_r2_s3_clear_s1_to_slot3
    title: Loaded R1 from slot 2 to slot 3, R2 blocker clears forward near A4
    side: right
    target_slot: "3"
    payload_condition: loaded
    selection_policy: nearest_loaded_to_target_slot_then_lowest_id
    loaded_shuttles: [right_shuttle_1]
    start_slots_by_shuttle:
      right_shuttle_1: "2"
      right_shuttle_2: "3"
    blocker_shuttle: right_shuttle_2
    blocker_start_slot: "3"
    blocker_clear_slot: "4"
    blocker_clear_sensor: A4_STOPPER_SENSOR
    blocker_clear_stopper: A4
    blocker_restore_slot: ""
    blocker_restore_policy: none
    clearance_strategy: clear_blocker_to_a4_stopper_then_move_loaded
    launch:
      right_shuttle_count: 2
      right_start_slots: "2,3"
      right_loaded_shuttles: "R1"
    expected:
      selected_shuttle: right_shuttle_1
      selected_target_slot: "3"
      blocker_shuttle: right_shuttle_2
      blocker_clear_slot: "4"
      blocker_clear_sensor: A4_STOPPER_SENSOR

