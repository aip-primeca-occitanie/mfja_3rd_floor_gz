      right_shuttle_2: "1"
      right_shuttle_3: "2"
    blocker_shuttle: right_shuttle_3
    blocker_start_slot: "2"
    blocker_clear_slot: ""
    blocker_clear_target: interior_loop
    blocker_clear_sensor: DA3IR
    blocker_clear_stopper: A3
    blocker_restore_slot: ""
    blocker_restore_policy: none
    clearance_strategy: clear_blocker_to_interior_loop_then_move_loaded
    launch:
      right_shuttle_count: 3
      right_start_slots: "4,1,2"
      right_loaded_shuttles: "R2"
    expected:
      selected_shuttle: right_shuttle_2
      selected_target_slot: "3"
      blocker_shuttle: right_shuttle_3
      blocker_clear_target: interior_loop
      blocker_clear_sensor: DA3IR

  - case_id: right_four_shuttles_loaded_r4_s4_to_slot1_clear_r2_interior_r1_s2
    title: Four right shuttles; R2 enters the interior loop and R1 clears slot 1 so loaded R4 reaches slot 1
    side: right
    speed: 0.08
    target_slot: "1"
    payload_condition: loaded
    selection_policy: nearest_loaded_to_target_slot_then_lowest_id
    loaded_shuttles: [right_shuttle_4]
    start_slots_by_shuttle:
      right_shuttle_1: "1"
      right_shuttle_2: "2"
      right_shuttle_3: "3"
      right_shuttle_4: "4"
    clearance_strategy: multi_blocker_clear_then_move_loaded
    clearance_steps:
      - shuttle: right_shuttle_2
        start_slot: "2"
        clear_target: interior_loop
        clear_sensor: DA3IR
        clear_stopper: A3
      - shuttle: right_shuttle_1
        start_slot: "1"
        clear_slot: "2"
    launch:
      right_shuttle_count: 4
      right_start_slots: "1,2,3,4"
