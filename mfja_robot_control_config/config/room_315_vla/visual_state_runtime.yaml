room_315_visual_state_inference_node:
  ros__parameters:
    use_sim_time: true

    left_image_topic: /room_315/vla/left_rail_rgbd/image
    right_image_topic: /room_315/vla/right_rail_rgbd/image
    left_presence_topic: /room_315/rails/left/shuttles/state
    right_presence_topic: /room_315/rails/right/shuttles/state

    # Example local deployment path. Override these launch arguments on other hosts.
    checkpoint_path: /home/tiago/room315_full_training_approved_archive_seed31520260730/results/run/best.pt
    sidecar_directory: /home/tiago/room315_full_training_approved_archive_seed31520260730/results/run
    expected_checkpoint_sha256: 8a2d865e3d3551ec4284b53aa913d66f24640e23556f2f26b49a165f3ce8d51d
    expected_target_stats_sha256: 2d48078641842aa2db7a59b9285fc5bbedaaa3a0039fc39986ca230db983b18c
    expected_vectorizer_sha256: 637c854556f3331c4e187db4aa7fc70457f01df8877947b9a0e988a543f7113e
    expected_training_config_sha256: 5c45544af7766afff397dafa7c14c0b3b05083f07a93122308ef50c2e8f452eb
    expected_run_metadata_sha256: d86c0ebfda3f5b174fc3c06f4ce8a3e083d2048db7b44d20efe951aaa7e5428d

    device: auto
    synchronization_queue_size: 10
    maximum_timestamp_difference_s: 0.1
    stale_image_timeout_s: 1.0
    inference_frequency_limit_hz: 5.0

    presence_state_timeout_s: 1.0
    presence_warmup_s: 0.5

    s_ratio_tolerance: 0.02
    s_m_tolerance_m: 0.02
    position_consistency_tolerance_m: 0.08
    # s_m is the canonical learned physical coordinate. The redundant ratio
    # is projected from learned s_m / learned segment length; raw model output
    # remains published for diagnostics. No controller/Gazebo position is used.
    reconcile_position_consistency: true
    position_reconciliation_policy: canonical_s_m
    # Under bounded_s_m this is a hard rejection bound. Under canonical_s_m it
    # marks a large raw-head disagreement in clamped_fields without replacing
    # the learned canonical coordinate.
    max_position_reconciliation_error_m: 0.40

    temporal_filter_enabled: false
    temporal_majority_window: 3
    temporal_ema_alpha: 0.5

    # Dry run still publishes validated/fused observations but never mutates
    # PlanSys2 knowledge.
    dry_run_state_fusion: true
    plansys2_update_enabled: false
    plansys2_add_predicate_service: /problem_expert/add_predicate
    plansys2_remove_predicate_service: /problem_expert/remove_predicate

    safety_status_topic: /room_315/vla/status
    safety_status_timeout_s: 1.5

    raw_observation_topic: /room_315/visual_state/raw
    validation_topic: /room_315/visual_state/validation
    accepted_observed_state_topic: /room_315/visual_state/observed_state
    diagnostics_topic: /diagnostics
    diagnostic_period_s: 1.0
