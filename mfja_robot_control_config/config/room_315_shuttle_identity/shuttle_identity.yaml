version: 1
description: Room 315 shuttle perimeter identity frame mapping.
marker_family: tag36h11
identity_design:
  payload_zone: center
  identity_safe_zones:
    - front_left
    - front_right
    - rear_left
    - rear_right
  notes:
    - Perimeter markers remain outside the normal centered payload zone.
    - AprilTag/tracker detections are privileged metadata only and are not model_input.
    - Large text labels are visual cues in the RGB image, not structured model input.
