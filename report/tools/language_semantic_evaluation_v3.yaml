schema_version: 1
evaluation_id: room315_language_semantic_evaluation_v3
purpose: >-
  Evaluate the configured local semantic gateway, strict envelope boundary and
  deterministic fusion on the repository's predeclared ten-case English
  interface corpus. This is an offline language-contract evaluation, not a
  motion, latency or reliability campaign.

method: >-
  Each non-control utterance is passed once through the production
  ConversationalIntentGatewayParser so that the real backend result, strict
  SemanticParseEnvelope and fusion trace are retained even for a rejected
  draft. Domain validation follows successful parsing. Parser issues are
  classified with the same missing/ambiguous-versus-error rule used by the
  TaskGoal builder. The cancellation utterance is passed through the
  TaskGoalDialogueManager and a backend-call counter must remain unchanged.

corpus:
  path: mfja_robot_control_config/config/room_315_vla/task_goal_english_benchmark.yaml
  sha256: 1a945519f6b5b58e9c44ca8c7de823832f4898fb442276572048cf3d5903a9cc
  case_count: 10

semantic_config:
  path: /home/tiago/models/room315_intent/task_goal_understanding.local.yaml
  sha256: 6d8c8658aa03273c45d738f8fd7437bf516713ebca47cb508fc1b999d07d35ea
  required_backend: llama_cpp
  require_ready: true
  require_offline: true

