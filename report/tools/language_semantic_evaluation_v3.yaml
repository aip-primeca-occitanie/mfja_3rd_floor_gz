acceptance:
  - All ten outcomes match the status, constraints and issue codes declared in the unchanged repository corpus.
  - Each of the nine non-control cases invokes the ready configured semantic model exactly once with the expected fingerprint.
  - Accepted and clarification cases must produce a strict semantic envelope without fallback.
  - A predeclared error case may use deterministic fallback only when the model output is rejected by the strict semantic-envelope schema and the final result remains the declared error.
  - The cancellation case is intercepted by the dialogue control boundary without model invocation.
  - No case declared ambiguous, inconsistent or invalid is resolved automatically as an executable goal.

claim_boundary:
  - The evaluation measures the language-contract, envelope and fusion boundary only.
  - The one observation per utterance is not a language-accuracy or latency benchmark.
  - It does not measure motion execution, statistical reliability, multilingual behaviour or requests outside the ten declared cases.
