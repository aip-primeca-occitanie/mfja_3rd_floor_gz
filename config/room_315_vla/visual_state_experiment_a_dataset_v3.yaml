      expected_rows: 4000
      expected_rows_sha256: PENDING_CAPTURE_AND_FINAL_AUDIT
      expected_labels_sha256: PENDING_CAPTURE_AND_FINAL_AUDIT

validation:
  selection_role: validation_only
  rows: /home/tiago/room315_hard_case_visual_v3_splits_seed31520260730/validation.jsonl
  labels: /home/tiago/room315_hard_case_visual_v3_splits_seed31520260730/validation_visual_labels.jsonl
  dataset_root: /home/tiago/room315_hard_case_visual_v3_capture_seed31520260730/dataset
  expected_rows: 512
  expected_rows_sha256: PENDING_CAPTURE_AND_FINAL_AUDIT
  expected_labels_sha256: PENDING_CAPTURE_AND_FINAL_AUDIT
