  labels: /home/tiago/room315_hard_case_visual_v3_canary_seed31520260730/finalized/canary_visual_labels.jsonl
  dataset_root: /home/tiago/room315_hard_case_visual_v3_canary_seed31520260730/dataset
  expected_rows: 256
  role: development_regression_only
  permitted_for_training: false
  permitted_for_checkpoint_selection: false
  permitted_for_final_test_claims: false

integrity:
  split_package_manifest: /home/tiago/room315_hard_case_visual_v3_splits_seed31520260730/package_manifest.json
  split_overlap_audit: /home/tiago/room315_hard_case_visual_v3_splits_seed31520260730/split_overlap_audit.json
  dataset_manifest: /home/tiago/room315_hard_case_visual_v3_guard_seed31520260730/dataset_manifest.json
  require_all_expected_hashes: true
  fail_on_pending_hash: true

legacy_test_policy:
  prohibited: true
  path_basenames:
    - test.jsonl
    - test_visual_labels.jsonl
  use_for_training: false
  use_for_validation: false
  use_for_tuning: false
  use_for_evaluation: false
  create_new_final_test: false
