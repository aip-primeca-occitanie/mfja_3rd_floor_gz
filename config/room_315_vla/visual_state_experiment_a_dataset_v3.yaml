    old_replay_train:
      rows: /home/tiago/room315_arbitrary_subset_visual_splits_v1_seed31520260730/train.jsonl
      labels: /home/tiago/room315_arbitrary_subset_visual_splits_v1_seed31520260730/train_visual_labels.jsonl
